    <!-- The homepage hero is now a text/gradient design with no background
         photo (src/pages/Home.tsx), so the picsum.photos preload/preconnect
         that used to target the old photographic hero image was removed —
         picsum.photos is still used for other on-page images, but none of
         them are the LCP element anymore. -->

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Site-wide entity/brand schema — kept static (not injected via JS)
         so it's visible to crawlers/scrapers that don't execute JavaScript,
         unlike the per-page WebPage/Breadcrumb/FAQ schema which is injected
         at runtime via src/hooks/useJsonLd.ts (fine for Googlebot, which
         does render JS, but not a substitute for this for other consumers). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.innbly.com/#organization",
        "name": "Innbly",
        "url": "https://www.innbly.com/",
        "logo": "https://www.innbly.com/brand/innbly-icon.jpg",
        "description": "Innbly is a verified vacation rental and unique-stays marketplace in India, listing villas, holiday homes, cabins, cottages, farmhouses and apartments for short getaways.",
        "sameAs": [
          "https://www.instagram.com/innbly",
          "https://www.facebook.com/share/1disYe1r9U/",
          "https://youtube.com/@innbly"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.innbly.com/#website",
        "name": "Innbly",
        "url": "https://www.innbly.com/",
        "publisher": { "@id": "https://www.innbly.com/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.innbly.com/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
